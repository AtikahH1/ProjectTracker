name: Create partner simple

on:
  workflow_dispatch:
    inputs:
      partner_name:
        description: "Partner Name"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Create parent issue and sub-issues
        uses: actions/github-script@v8
        env:
          PARTNER_NAME: ${{ inputs.partner_name }}
        with:
          script: |
            const partner = process.env.PARTNER_NAME.trim();

            if (!partner) {
              core.setFailed("Partner Name cannot be empty.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const phases = [
              {
                title: "Task One",
                body: [
                  "- [ ] sub task 1.1",
                  "- [ ] sub task 1.2",
                  "- [ ] sub task 1.3"
                ].join("\n")
              },
              {
                title: "Task Two",
                body: [
                  "- [ ] sub task 2.1",
                  "- [ ] sub task 2.2",
                  "- [ ] sub task 2.3"
                ].join("\n")
              },
              {
                title: "Task Three",
                body: [
                  "- [ ] sub task 3.1",
                  "- [ ] sub task 3.2",
                  "- [ ] sub task 3.3"
                ].join("\n")
              }
            ];

            const parentBody = [
              "## Partner",
              "",
              partner,
              "",
              "## Partner Lifecycle",
              "",
              "The lifecycle phase sub-issues are created and linked automatically below."
            ].join("\n");

            const parent = await github.rest.issues.create({
              owner,
              repo,
              title: '[Partner] ${partner}',
              body: parentBody
            });

            core.info(
              'Created parent issue #${parent.date.number}: ${parent.data.html_url}'
            );

            for (const phase of phases) {
              const childBody = [
                '## ${phase.title}',
                "",
                phase.body,
                "",
                'Parent partner: ${partner}'
              ].join("\n");

              const child = await github.rest.issues.create({
                owner,
                repo,
                title: '${partner} | ${phase.title}',
                body: childBody
              });

              core.info(
                'Created child issue #${child.data.number}: ${child.data.html_url}'
              );

              await github.request(
                "POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues",
                {
                  owner,
                  repo,
                  issue_number: parent.data.number,
                  sub_issue_id: child.data.id,
                  headers: {
                    "X-GitHub-Api-Version": "2026-03-10"
                  }
                }
              );

              core.info(
                'Linked issue #${child.data.number} under parent #${parent.data.number}'
              );
            }

            core.notice(
              'Created partner issue #${parent.data.number} with ${phases.length} sub-issues.'
            );
              
            

            
